<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00fff7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0d1821" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0d1821"/>

  <!-- Outer glow ring -->
  <circle cx="22" cy="32" r="18" fill="url(#glow)"/>

  <!-- Circle border with cyan glow -->
  <circle cx="22" cy="32" r="15" fill="none" stroke="#00e5d8" stroke-width="1.5"
    style="filter: drop-shadow(0 0 4px #00fff7) drop-shadow(0 0 8px #00e5d8)"/>

  <!-- Inner lighter fill -->
  <circle cx="22" cy="32" r="13" fill="rgba(0,229,216,0.07)"/>

  <!-- Glowing D letter -->
  <text x="15" y="40" font-family="Arial Black, sans-serif" font-weight="900"
    font-size="26" fill="white" filter="url(#blur)"
    style="filter: drop-shadow(0 0 5px #00fff7) drop-shadow(0 0 10px #00e5d8)">D</text>

  <!-- "_Tech" text -->
  <text x="38" y="37" font-family="Arial, sans-serif" font-weight="700"
    font-size="9" fill="white" opacity="0.92" letter-spacing="0.5">_Tech</text>
</svg>
